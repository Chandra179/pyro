[project]
name = "pyro"
version = "0.1.0"
description = "Engineering blog architecture synthesis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "playwright>=1.45",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "litellm>=1.44",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "trafilatura>=1.12",
    "tiktoken>=0.7",
    "json-repair>=0.30",
    "python-arango>=8.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "tenacity>=9.0",
]

[project.scripts]
pyro = "pyro.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# B008: typer's `= typer.Option(...)` default pattern is idiomatic, not a bug.
# BLE001: the extraction cascade intentionally catches any provider-level error to advance to the next model.
ignore = ["B008", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
