# Non-secret pipeline configuration, loaded by src/pyro/config.py:Settings.
# API keys stay in .env. Any value here can be overridden via an env var of
# the same name, e.g. EXTRACTION_CONCURRENCY=10.
#
# Only values that actually differ from config.py's field defaults belong here — a value
# restated with the same default silently shadows any future change to that default (bit us
# once with sitemap.non_article_path_segments). 1. Business/product config (always explicit,
# even where it matches the default, since this is the point of business config). 2. Temporary
# dev/test overrides (revert before a real run). 3. System/infra overrides.

# ============================================================================
# 1. Business / product configuration
# ============================================================================

# Fixed domain taxonomy, tagged on extracted entities/relationships as a shared axis for a
# future cross-company comparison feature. "Other" is the required fallback.
domains:
  - Authentication
  - Recommendation Engine
  - Messaging & Real-Time
  - Compute Orchestration
  - Observability
  - Data Platform
  - ML/Detection
  - Media/Content Pipeline
  - Network Infrastructure
  - Developer Platform
  - Other

# ============================================================================
# 2. TEMPORARY dev/test overrides — revert before a real run
# ============================================================================

# Caps graph-merge calls for cheap local test runs. Remove/raise once prompts are stable.
graph_article_limit: 100

# ============================================================================
# 3. System / infrastructure overrides — only where these differ from config.py
# ============================================================================

# Concurrency, bounded to the active tier's RPM limit. TokenRouter's paid deepseek tier
# throttles to 1 req/min — raise this once running against a tier with real RPM budget.
extraction_concurrency: 1

# Fallback output cap for cascade tiers litellm's model registry doesn't recognize
# (see router._max_tokens_for) — raised well above the code default (2000).
extraction_max_tokens: 100000

# Not the current setup (TokenRouter only) — see graph_model_params() in router.py.
graph_model: "deepseek/deepseek-v4-flash-0731"

router:
  timeout: 9000
  # OpenCode Zen's free tier (opencode_free_models) is currently rate-limited on this account,
  # and each stuck tier eats up to rate_limit_max_retries * rate_limit_wait_seconds before the
  # cascade advances — emptying this list here skips straight past it to OpenCode Go instead of
  # stalling for minutes on a dead tier.
  opencode_free_models: []
  # Bypasses litellm entirely for OpenCode Go (see router/opencode_go.py's docstring for why).
  opencode_go_enabled: true
