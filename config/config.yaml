# Non-secret pipeline configuration, loaded by src/pyro/config.py:Settings.
# API keys stay in .env. Any value here can be overridden via an env var of
# the same name, e.g. EXTRACTION_CONCURRENCY=10.
#
# Only values that actually differ from config.py's field defaults belong here — a value
# restated with the same default silently shadows any future change to that default (bit us
# once with sitemap.non_article_path_segments). 1. Business/product config (always explicit,
# even where it matches the default, since this is the point of business config). 2. Temporary
# dev/test overrides (revert before a real run). 3. System/infra overrides.

# ============================================================================
# 1. Business / product configuration
# ============================================================================

# "structured" (default): schema-validated extraction + grouped batch synthesis per
# domain. "freeform": no domain grouping — each article is routed into an existing
# or new topic file instead.
pipeline_mode: "freeform"

# freeform mode only: "summary" (default) routes on the LLM-generated extraction
# summary; "cleaned_text" routes on the article's full cleaned text instead.
freeform_route_source: "cleaned_text"

# Fixed domain taxonomy (structured mode only). "Other" is the required fallback.
domains:
  - Authentication
  - Recommendation Engine
  - Messaging & Real-Time
  - Compute Orchestration
  - Observability
  - Data Platform
  - ML/Detection
  - Media/Content Pipeline
  - Other

# Prompt template paths, relative to the top-level prompts/ dir. Swap a field to a
# different file to change that prompt, picked up at runtime.
prompts:
  extraction_system: "extraction/structured/default/system.md"
  extraction_user: "extraction/structured/default/user.md"
  synthesis_system: "synthesis/structured/default/system.md"
  synthesis_user: "synthesis/structured/default/user.md"
  synthesis_batch_system: "synthesis/structured/default/batch_system.md"
  synthesis_batch_user: "synthesis/structured/default/batch_user.md"
  extraction_freeform_system: "extraction/freeform/default/system.md"
  extraction_freeform_user: "extraction/freeform/default/user.md"
  synthesis_freeform_route_system: "synthesis/freeform/default/route_system.md"
  synthesis_freeform_route_user: "synthesis/freeform/default/route_user.md"

# ============================================================================
# 2. TEMPORARY dev/test overrides — revert before a real run
# ============================================================================

# Caps synthesis for cheap local test runs. Remove/raise once prompts are stable.
synthesis_batch_size: 2
synthesis_article_limit: 100

# ============================================================================
# 3. System / infrastructure overrides — only where these differ from config.py
# ============================================================================

# Concurrency, bounded to the active tier's RPM limit. TokenRouter's paid deepseek tier
# throttles to 1 req/min — raise this once running against a tier with real RPM budget.
extraction_concurrency: 1

# Fallback output cap for cascade tiers litellm's model registry doesn't recognize
# (see router._max_tokens_for) — raised well above the code default (2000).
extraction_max_tokens: 100000

# Not the current setup (TokenRouter only) — see synthesis_model_params() in router.py.
synthesis_model: "deepseek/deepseek-v4-flash-0731"

router:
  # Per-request cap so a stalled model raises a timeout and triggers fallback —
  # tighter than config.py's default (60s).
  timeout: 20
