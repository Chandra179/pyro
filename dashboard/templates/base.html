<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}pyro dashboard{% endblock %}</title>
    <script>
      // Applied before Tailwind renders anything, so there's no flash of the wrong theme.
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
    <script src="{{ url_for('static', path='js/htmx.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/mermaid.min.js') }}"></script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div class="flex h-full">
      <aside
        class="flex w-60 shrink-0 flex-col border-r border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"
      >
        <div class="flex items-center gap-2 px-5 py-5">
          <div class="flex h-8 w-8 items-center justify-center rounded-md bg-indigo-500 text-sm font-bold text-white">
            P
          </div>
          <span class="text-lg font-semibold">pyro</span>
        </div>
        <nav class="flex-1 space-y-1 px-3">
          <a
            href="/"
            class="flex items-center gap-2 rounded-md px-3 py-2 text-sm font-medium {% block nav_runs_class %}text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800{% endblock %}"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7m-9 2v9m0 0h4m-4 0H5m14-9l2 2m-2-2v9a1 1 0 01-1 1h-3m0-9v9m0-9h-3" />
            </svg>
            Runs
          </a>
          <a
            href="/data"
            class="flex items-center gap-2 rounded-md px-3 py-2 text-sm font-medium {% block nav_data_class %}text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800{% endblock %}"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7c0-1.657 3.582-3 8-3s8 1.343 8 3-3.582 3-8 3-8-1.343-8-3zm0 0v10c0 1.657 3.582 3 8 3s8-1.343 8-3V7m-16 5c0 1.657 3.582 3 8 3s8-1.343 8-3" />
            </svg>
            <span class="flex-1">Data</span>
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500" title="Live from the database"></span>
          </a>
          <span
            class="flex cursor-not-allowed items-center gap-2 rounded-md px-3 py-2 text-sm text-slate-400 dark:text-slate-600"
          >
            Settings
            <span class="ml-auto rounded bg-slate-100 px-1.5 py-0.5 text-[10px] dark:bg-slate-800">soon</span>
          </span>
        </nav>
        <div class="border-t border-slate-200 px-5 py-4 text-xs text-slate-400 dark:border-slate-800 dark:text-slate-600">
          v0.1.0
        </div>
      </aside>

      <div class="flex flex-1 flex-col overflow-y-auto">
        <header
          class="flex items-center justify-between border-b border-slate-200 px-8 py-4 dark:border-slate-800"
        >
          <div>
            <h1 class="text-lg font-semibold">{% block page_title %}Runs{% endblock %}</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">
              {% block page_subtitle %}Engineering blog architecture extraction{% endblock %}
            </p>
          </div>
          <button
            id="theme-toggle"
            type="button"
            aria-label="Toggle dark mode"
            class="flex h-9 w-9 items-center justify-center rounded-md border border-slate-200 text-slate-500 hover:bg-slate-100 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800"
          >
            <svg id="icon-sun" class="hidden h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="icon-moon" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
        </header>
        <main class="flex-1 px-8 py-6">{% block content %}{% endblock %}</main>
      </div>
    </div>

    <script>
      (function () {
        var root = document.documentElement;
        var sun = document.getElementById("icon-sun");
        var moon = document.getElementById("icon-moon");
        function syncIcons() {
          var isDark = root.classList.contains("dark");
          sun.classList.toggle("hidden", !isDark);
          moon.classList.toggle("hidden", isDark);
        }
        syncIcons();
        document.getElementById("theme-toggle").addEventListener("click", function () {
          root.classList.toggle("dark");
          localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
          syncIcons();
        });
      })();
    </script>

    <script>
      // Diagrams in synthesized docs come back from the server as
      // `<pre class="mermaid">` blocks (see api/render.py) — mermaid.js
      // scans for that class and swaps in an inline SVG. startOnLoad is off
      // because the doc modal's content only exists after an htmx swap.
      mermaid.initialize({
        startOnLoad: false,
        theme: document.documentElement.classList.contains("dark") ? "dark" : "default",
      });

      // Doc modal resize button — toggles between the default reading-
      // column width (sm:max-w-3xl, set in partials/data_shell.html) and
      // .doc-modal--expanded (input.css) for docs with wide diagrams/tables.
      // Persisted so the choice survives closing/reopening a doc, and
      // reapplied after htmx:afterSwap below since a company/tab switch
      // recreates the <dialog> from the server template's default class.
      function isDocModalExpanded() {
        return localStorage.getItem("docModalExpanded") === "1";
      }
      function applyDocModalExpanded(expanded) {
        var dialog = document.getElementById("doc-modal");
        if (!dialog) return;
        dialog.classList.toggle("doc-modal--expanded", expanded);
        var expandIcon = document.getElementById("doc-modal-expand-icon");
        var collapseIcon = document.getElementById("doc-modal-collapse-icon");
        if (expandIcon) expandIcon.classList.toggle("hidden", expanded);
        if (collapseIcon) collapseIcon.classList.toggle("hidden", !expanded);
      }
      function toggleDocModalSize() {
        var expanded = !isDocModalExpanded();
        localStorage.setItem("docModalExpanded", expanded ? "1" : "0");
        applyDocModalExpanded(expanded);
      }

      document.body.addEventListener("htmx:afterSwap", function (evt) {
        var target = evt.detail.target;
        if (!target) return;
        if (target.id === "doc-modal-body") {
          // Re-read the theme here rather than trusting the initialize()
          // call above — that one only ran once at page load, so a diagram
          // opened after a later dark-mode toggle would otherwise render
          // with stale (mismatched) colors against the current page theme.
          mermaid.initialize({
            startOnLoad: false,
            theme: document.documentElement.classList.contains("dark") ? "dark" : "default",
          });
          mermaid.run({ querySelector: "#doc-modal-body .mermaid" });
          applyDocModalExpanded(isDocModalExpanded());
        }
        if (target.id === "data-shell" || target.querySelector("#doc-modal")) {
          applyDocModalExpanded(isDocModalExpanded());
        }
      });

      // Click on the <dialog> backdrop (not its content) closes it — native
      // <dialog> only auto-closes on Escape by default.
      document.addEventListener("click", function (evt) {
        var dialog = document.getElementById("doc-modal");
        if (dialog && evt.target === dialog) dialog.close();
      });
    </script>
  </body>
</html>
